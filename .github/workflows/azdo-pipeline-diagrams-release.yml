name: azdo-pipeline-diagrams-release

on:
  push:
    branches:
      - main
    paths:
      - 'azdo-pipeline-diagrams/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/azdo-pipeline-diagrams-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package and upload a VSIX for
        required: false
        type: string

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['azdo-pipeline-diagrams--release_created'] }}
      tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true
      - id: resolve-tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || steps.release.outputs['azdo-pipeline-diagrams--tag_name'] || inputs.release_tag }}
        run: echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  upload-vsix:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Install dependencies
        working-directory: azdo-pipeline-diagrams
        run: pnpm install --frozen-lockfile
      - name: Build extension
        working-directory: azdo-pipeline-diagrams
        run: pnpm run build
      - name: Build VSIX package
        working-directory: azdo-pipeline-diagrams
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Upload VSIX to release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" azdo-pipeline-diagrams/*.vsix --clobber
